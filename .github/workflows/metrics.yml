name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Le 1er de chaque mois à minuit

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dist directory
        run: mkdir -p dist

      - uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics.svg
          token: ${{ secrets.GH_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, makefile
          plugin_languages_limit: 6
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_lines: yes
          output_action: dry-run

      - name: Push metrics.svg to metrics-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}